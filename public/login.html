<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Access</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="noise"></div>
<main class="panel login">
  <h1>ACCESS</h1>
  <p class="tag">authorization required</p>
  <input id="cid" placeholder="Client ID"/>
  <input id="pass" type="password" placeholder="Password"/>
  <button onclick="login()">LOGIN</button>
  <div class="terminal" id="msg"></div>
</main>

<audio id="beep">
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=">
</audio>

<script>
function beep(){ const b=document.getElementById("beep"); if(b){ b.currentTime=0; b.play().catch(()=>{});} }
async function login(){

  const id=document.getElementById("id").value;
  const pass=document.getElementById("pass").value;

  const r=await fetch(`/api/login?id=${id}&pass=${pass}`);
  const d=await r.json();

  if(!d.ok){
    alert(d.msg);
    return;
  }

  // এখানে add করবে
  localStorage.setItem("token", d.token);
  localStorage.setItem("exp", d.expires);

  location.href="index.html";

}
</script>
</body>
</html>
