<!DOCTYPE html>
<html>
<head>
<title>Shadow Console</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="bg">

    <canvas id="matrix"></canvas>

<div class="topbar">

<div class="dates">
Today: <span id="today"></span><br>
Expiry: <span id="expiry"></span><br>
Remaining: <span id="remain"></span> days
</div>

<button onclick="logout()">LOGOUT</button>

</div>


<div class="card">

<h1>SHADOW CONSOLE</h1>
<p class="sub">secure execution interface</p>

<input id="target" placeholder="Target">

<div class="row">

<input id="hits" placeholder="Hits">

<input id="interval" placeholder="Interval (sec)">

</div>

<div class="row">

<button class="start" onclick="start()">START</button>
<button onclick="stop()">STOP</button>
<button onclick="clearLog()">CLEAR LOG</button>

</div>

<div class="stats">

Sent: <span id="sent">0</span>
Failed: <span id="failed">0</span>
Total: <span id="total">0</span>

</div>

<div id="console"></div>

</div>

<script src="script.js"></script>

</body>
</html>
