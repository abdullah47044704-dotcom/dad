<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Shadow Console</title>

<link rel="stylesheet" href="style.css"/>

<script>

const uid = localStorage.getItem("uid");
const exp = localStorage.getItem("exp");

async function checkLogin(){

if(!uid || !exp){
localStorage.clear();
location.href="login.html";
return;
}

if(new Date() > new Date(exp)){
localStorage.clear();
location.href="login.html";
return;
}

try{

const r = await fetch(`/api/check?id=${uid}`);
const d = await r.json();

if(!d.ok){
localStorage.clear();
location.href="login.html";
}

}catch(e){

localStorage.clear();
location.href="login.html";

}

}

checkLogin();

</script>

</head>

<body>

<div class="noise"></div>

<canvas id="matrix"></canvas>

<header class="topbar">

<div class="status">

<span id="today"></span>

<span id="expiry"></span>

<span id="remain"></span>

</div>

<button id="logoutBtn" class="ghost">LOGOUT</button>

</header>

<main class="panel">

<h1>SHADOW • CONSOLE</h1>

<p class="tag">secure execution interface</p>

<input id="number" placeholder="Target Number"/>

<div class="row">

<input id="hits" type="number" min="1" placeholder="Hits"/>

<input id="interval" type="number" min="0.5" step="0.5" placeholder="Interval (sec)"/>

</div>

<div class="row">

<button id="startBtn">START</button>

<button id="stopBtn" class="ghost">STOP</button>

<button id="clearBtn" class="ghost">CLEAR LOG</button>

</div>

<div class="stats">

<span>Sent: <b id="sent">0</b></span>

<span>Failed: <b id="failed">0</b></span>

<span>Total: <b id="total">0</b></span>

</div>

<div class="terminal" id="log"></div>

</main>

<audio id="beep">

<source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=">

</audio>

<script src="script.js"></script>

</body>

</html>
